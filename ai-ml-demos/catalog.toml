[platforms.imx8mplus]
camera_resolutions = [{title = "SD - 720 x 480 (default)", value = "720x480"}, {title = "VGA - 640 x 480", value = "640x480"}, {title = "HD - 720p (1280 x 720)", value = "1280x720"}, {title = "Full HD - 1080p (1920 x 1080)", value = "1920x1080"}]
name = "i.MX 8M Plus"
compatible = ["fsl,imx8mp"]
status = "validated"
asset_base_url = "https://nyc3.digitaloceanspaces.com/variscite-marketing/demos/machine-learning/imx8mplus/v2"
delegate_path = "/usr/lib/libvx_delegate.so"
runtime_plugins = "appsink decodebin imxvideoconvert_g2d h264parse qtdemux v4l2src videoconvert"

[platforms.imx93]
camera_resolutions = [{title = "VGA - 640 x 480 (default)", value = "640x480"}, {title = "HD - 720p (1280 x 720)", value = "1280x720"}, {title = "Full HD - 1080p (1920 x 1080)", value = "1920x1080"}]
name = "i.MX 93"
compatible = ["fsl,imx93"]
status = "validated"
asset_base_url = "https://nyc3.digitaloceanspaces.com/variscite-marketing/demos/machine-learning/imx93/v1"
delegate_path = "/usr/lib/libethosu_delegate.so"
runtime_plugins = "appsink v4l2src videoconvert avidemux jpegdec imxvideoconvert_pxp"

[platforms.imx95]
